# Render Blueprint for production: the site is the only public service; the
# API is a private service that only the site reaches, over Render's private
# network (all three in the same region). Setup steps and the values asked
# on creation are in the "Deploy no Render" section of the README.
#
# Production follows the producao branch: a change reaches it only through a
# pull request from main, after being validated in the staging environment
# (render.homolog.yaml). checksPass waits for the CI of the commit to succeed.
# Schema: https://render.com/schema/render.yaml.json
#
# Values marked "sync: false" are asked once, when the Blueprint is created.

services:
  - type: pserv
    name: eldo-api
    runtime: docker
    repo: https://github.com/Eldo-Eletrostatica/Backend
    branch: producao
    autoDeployTrigger: checksPass
    plan: starter
    region: virginia
    envVars:
      # Fixed so the site's API_HOSTPORT always names the port the API uses.
      - key: PORT
        value: '3000'
      - key: DB_HOST
        fromDatabase:
          name: eldo-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: eldo-db
          property: port
      - key: DB_USERNAME
        fromDatabase:
          name: eldo-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: eldo-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: eldo-db
          property: database
      # Base64 of 256 random bits: passes the production check (32+ chars).
      - key: JWT_SECRET
        generateValue: true
      - key: INITIAL_ADMIN_NAME
        value: Administrador Eldo
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      # Cloudflare R2 (ADR 0006). The endpoint is the account's S3 API URL;
      # the public URL is the bucket's public address (r2.dev or a custom
      # domain), which already points at the bucket, so it has no bucket path.
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        value: eldo
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_URL
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: NOTIFICATION_EMAIL
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      # Without GOOGLE_PLACES_API_KEY (Backend#65) the home page says the
      # reviews are unavailable; adding the key in the dashboard turns them on.
      - key: USE_SAMPLE_REVIEWS
        value: 'false'
      - key: GOOGLE_PLACE_ID
        value: ChIJc3r5Q0UtWpMRcWGTgj811LI

  - type: web
    name: eldo-site
    runtime: docker
    repo: https://github.com/Eldo-Eletrostatica/Frontend
    branch: producao
    autoDeployTrigger: checksPass
    plan: starter
    region: virginia
    # A static route: "/" also depends on the API.
    healthCheckPath: /robots.txt
    # Render passes these to docker build as build args; next build writes
    # them into the output, so changing one needs a new deploy.
    envVars:
      # The API's private-network host:port, with a suffix Render picks when
      # it creates the API. The Frontend calls http://<API_HOSTPORT>.
      - key: API_HOSTPORT
        fromService:
          type: pserv
          name: eldo-api
          property: hostport
      # The same public bucket address as the API's S3_PUBLIC_URL.
      - key: STORAGE_PUBLIC_URL
        sync: false
      - key: NEXT_PUBLIC_TURNSTILE_SITE_KEY
        sync: false

databases:
  - name: eldo-db
    plan: basic-256mb
    region: virginia
    postgresMajorVersion: '16'
    databaseName: eldo
    user: eldo
    # Data fits in 1 GB; the room is for the WAL and growth, since a full
    # disk suspends the database. The disk can grow but never shrink.
    diskSizeGB: 5
    storageAutoscalingEnabled: true
