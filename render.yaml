# Render Blueprint for the demo on the free plan. Every service is free: the
# API runs as a public web service because private services have no free
# instance. The move to production (private service, paid plans, R2) is in
# the "Deploy no Render" section of the README.
# Schema: https://render.com/schema/render.yaml.json
#
# Values marked "sync: false" are asked once, when the Blueprint is created.

services:
  - type: web
    name: eldo-api
    runtime: docker
    repo: https://github.com/Eldo-Eletrostatica/Backend
    branch: main
    plan: free
    region: virginia
    healthCheckPath: /
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: eldo-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: eldo-db
          property: port
      - key: DB_USERNAME
        fromDatabase:
          name: eldo-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: eldo-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: eldo-db
          property: database
      # Base64 of 256 random bits: passes the production check (32+ chars).
      - key: JWT_SECRET
        generateValue: true
      - key: INITIAL_ADMIN_NAME
        value: Administrador Eldo
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      # Placeholder storage until the R2 account exists: the API starts, but
      # image uploads and quotes by PDF fail. Same URL as the Frontend's
      # STORAGE_PUBLIC_URL.
      - key: S3_ENDPOINT
        value: https://armazenamento-provisorio.invalid
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        value: eldo
      - key: S3_ACCESS_KEY_ID
        value: provisorio
      - key: S3_SECRET_ACCESS_KEY
        value: provisorio
      - key: S3_PUBLIC_URL
        value: https://armazenamento-provisorio.invalid/eldo
      # A free web service cannot send on the SMTP ports (25, 465, 587): the
      # notices fail and only reach the log until the API runs on a paid plan.
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: NOTIFICATION_EMAIL
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      # No Places API key yet (Backend#65): the home page shows sample reviews.
      - key: USE_SAMPLE_REVIEWS
        value: 'true'
      - key: GOOGLE_PLACE_ID
        value: ChIJc3r5Q0UtWpMRcWGTgj811LI

  - type: web
    name: eldo-site
    runtime: docker
    repo: https://github.com/Eldo-Eletrostatica/Frontend
    branch: main
    plan: free
    region: virginia
    # A static route: "/" fetches the API, which may still be waking up.
    healthCheckPath: /robots.txt
    # Render passes these to docker build as build args; next build writes
    # them into the output, so changing one needs a new deploy.
    envVars:
      # Public URL of eldo-api (https://eldo-api.onrender.com, or the one the
      # dashboard shows). A free web service cannot receive private traffic.
      - key: API_URL
        sync: false
      - key: STORAGE_PUBLIC_URL
        value: https://armazenamento-provisorio.invalid/eldo
      - key: NEXT_PUBLIC_TURNSTILE_SITE_KEY
        sync: false

databases:
  - name: eldo-db
    plan: free
    region: virginia
    postgresMajorVersion: '16'
    databaseName: eldo
    user: eldo
