services:
  postgres:
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  # S3-compatible storage for development (ADR 0006); production uses
  # Cloudflare R2 with the same S3_* variables.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: server -ip.bind=0.0.0.0 -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - '8333:8333'
    volumes:
      - seaweedfs_data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8333/healthz']
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the buckets once the storage is up and exits: eldo for development
  # and eldo-test for the integration tests, which delete what they upload.
  seaweedfs-setup:
    image: chrislusf/seaweedfs:4.48
    entrypoint: ['/bin/sh', '-c']
    command:
      - printf 's3.bucket.create -name eldo\ns3.bucket.create -name eldo-test\n' | weed shell -master=seaweedfs:9333 || true
    depends_on:
      seaweedfs:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3001:3000'
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: postgres
      S3_ENDPOINT: http://seaweedfs:8333
      S3_REGION: auto
      S3_BUCKET: eldo
      S3_ACCESS_KEY_ID: eldo-dev
      S3_SECRET_ACCESS_KEY: eldo-dev-secret
      S3_PUBLIC_URL: http://localhost:8333/eldo
      CHOKIDAR_USEPOLLING: 'true'
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      GOOGLE_PLACE_ID: ${GOOGLE_PLACE_ID:-}
      USE_SAMPLE_REVIEWS: ${USE_SAMPLE_REVIEWS:-true}
      JWT_SECRET: ${JWT_SECRET:-eldo-dev-jwt-secret}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-Administrador Eldo}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@eldo.com.br}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-Admin@123}
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs-setup:
        condition: service_completed_successfully

volumes:
  postgres_data:
  seaweedfs_data:
