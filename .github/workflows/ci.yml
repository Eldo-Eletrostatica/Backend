name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same PR cancels the run that became outdated.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    # This name is the required status check in the main branch protection.
    name: Lint, build e testes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: postgres
      S3_ENDPOINT: http://localhost:8333
      S3_REGION: auto
      S3_BUCKET: eldo
      S3_ACCESS_KEY_ID: eldo-dev
      S3_SECRET_ACCESS_KEY: eldo-dev-secret
      S3_PUBLIC_URL: http://localhost:8333/eldo
      JWT_SECRET: eldo-dev-jwt-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci fails when package-lock.json is out of sync with package.json.
      - run: npm ci

      - run: npm run lint:check

      - run: npm run build

      - run: npm run test

      # Service containers cannot mount repository files, so the S3 storage
      # starts from the compose file, which also creates the bucket.
      - run: docker compose up -d --wait seaweedfs
      - run: docker compose run --rm seaweedfs-setup

      - run: npm run test:e2e
